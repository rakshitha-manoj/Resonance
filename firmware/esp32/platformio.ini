[env]
build_flags = -ffp-contract=off

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_src_filter = -<*> +<main.cpp>

[env:selftest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_src_filter = -<*> +<selftest.cpp>

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
    -DWINDOWS_BIN=\"test/data/windows.bin\"
    -DSMOOTH_BIN=\"test/data/smooth.bin\"
test_framework = unity
test_filter = test_native

[env:netsim]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
    -DWINDOWS_BIN=\"test/data/windows.bin\"
    -DFUSION_BIN=\"test/data/fusion_vectors.bin\"
build_src_filter = -<*> +<netsim_main.cpp>
test_framework = unity
test_filter =
    test_net
    test_fusion

[env:master]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_MASTER
build_src_filter = -<*> +<net_main.cpp>

[env:slave1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=1
build_src_filter = -<*> +<net_main.cpp>

[env:slave2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=2
build_src_filter = -<*> +<net_main.cpp>

; Wokwi only: one slave with no radio, synthetic beacons (see slave_wokwi/)
[env:slave_wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=1
    -DWOKWI_STANDALONE
build_src_filter = -<*> +<net_main.cpp>

[env:espnow_logic]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
test_framework = unity
test_filter = test_espnow_logic
