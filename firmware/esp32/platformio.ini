[env]
build_flags = -ffp-contract=off

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_src_filter = -<*> +<main.cpp>

[env:selftest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_src_filter = -<*> +<selftest.cpp>

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
    -DWINDOWS_BIN=\"test/data/windows.bin\"
    -DSMOOTH_BIN=\"test/data/smooth.bin\"
test_framework = unity
test_filter = test_native

[env:netsim]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
    -DWINDOWS_BIN=\"test/data/windows.bin\"
    -DFUSION_BIN=\"test/data/fusion_vectors.bin\"
build_src_filter = -<*> +<netsim_main.cpp>
test_framework = unity
test_filter =
    test_net
    test_fusion

[env:master]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_MASTER
build_src_filter = -<*> +<net_main.cpp>

[env:slave1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=1
build_src_filter = -<*> +<net_main.cpp>

[env:slave2]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=2
build_src_filter = -<*> +<net_main.cpp>

; Wokwi only: one slave each, no radio, synthetic beacons (see wokwi/slave1, wokwi/slave2).
; Wokwi cannot run several boards in one simulation, so the 3-board system is simulated on the PC (netsim).
[env:slave1_wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=1
    -DWOKWI_STANDALONE
build_src_filter = -<*> +<net_main.cpp>

[env:slave2_wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_SLAVE
    -DNODE_ID=2
    -DWOKWI_STANDALONE
build_src_filter = -<*> +<net_main.cpp>

[env:espnow_logic]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
test_framework = unity
test_filter = test_espnow_logic

; MQTT uplink logic (topics, queue, back-off, publishing) on the PC: pio test -e mqtt_logic
[env:mqtt_logic]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
test_framework = unity
test_filter =
    test_mqtt_logic

; Wokwi cloud demo's in-process virtual slaves vs the netsim output of the same traces: pio test -e cloud_demo
; (include/demo_traces.h is generated from test/data/demo_traces.bin by the pre-script)
[env:cloud_demo]
platform = native
extra_scripts = pre:tools/pio_gen_demo.py
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
test_framework = unity
test_filter = test_cloud_demo

; Master + cloud uplink: Wi-Fi station + MQTT on core 0 (include/mqtt_uplink.h). Wi-Fi / broker settings:
; include/secrets.h (gitignored, copy secrets.example.h) or -D flags, see include/mqtt_config.h. Without WIFI_SSID the uplink stays off.
[env:master_mqtt]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
    knolleary/PubSubClient@^2.8
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_MASTER
    -DMQTT_ENABLED
build_src_filter = -<*> +<net_main.cpp>

; Wokwi cloud demo, no hardware: the real master path (Master + Fusion + JSON + MQTT task) with two VIRTUAL slaves in-process
; replaying test/data/demo_traces.bin, Wi-Fi Wokwi-GUEST (open, channel 6). Project: wokwi/master_cloud/.
[env:master_wokwi_cloud]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
    knolleary/PubSubClient@^2.8
extra_scripts = pre:tools/pio_gen_demo.py
build_flags =
    ${env.build_flags}
    -DNODE_ROLE_MASTER
    -DMQTT_ENABLED
    -DWOKWI_CLOUD_DEMO
    -DESPNOW_CHANNEL=6
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"
    -DWIFI_CHANNEL_HINT=6
build_src_filter = -<*> +<net_main.cpp>
