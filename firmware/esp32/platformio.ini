[env]
build_flags = -ffp-contract=off

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_src_filter = +<*> -<selftest.cpp>

[env:selftest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    electroniccats/MPU6050@^0.6.0
build_src_filter = -<*> +<selftest.cpp>

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -O2
    -std=gnu++11
    -DWINDOWS_BIN=\"test/data/windows.bin\"
    -DSMOOTH_BIN=\"test/data/smooth.bin\"
test_framework = unity
